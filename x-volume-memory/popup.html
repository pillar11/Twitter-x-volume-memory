<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; }
  small { color: #666; display: block; margin-top: 10px; }
</style>
</head>
<body>
  <h1>X Video Volume Memory</h1>
  <label><input type="checkbox" id="on"> Remember my video volume</label>
  <div class="row">
    <span>Volume</span>
    <input type="range" id="vol" min="0" max="100" step="1">
    <span id="pct">100%</span>
  </div>
  <small>Change the volume on any X video and it is saved for all of them. You can also set it here.</small>
  <script src="popup.js"></script>
</body>
</html>
